<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E6B38">
<title>Autorisation d’importation — E-Pharma</title>
<link rel="stylesheet" href="/secure-doc.css">
<style>
:root{--green:#0E6B38;--green-d:#0A4F29;--blue:#007FFF;--yellow:#F7D618;--red:#CE1021;--ink:#14231B;--mute:#5B6B62;--line:#D9E2DC;--gold:#B8941F}
*{box-sizing:border-box}
html,body{margin:0;background:#E9EEEB;color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar b{margin-right:auto}
.bar button,.bar a{font:inherit;background:var(--green);color:#fff;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none}
.bar a.alt{background:#fff;color:var(--green);border:1px solid var(--green)}
#stage{padding:14px;display:flex;justify-content:center}
#wrap{position:relative;overflow:hidden;max-width:100%}
.sheet{width:297mm;height:210mm;background:#fff;position:relative;overflow:hidden;transform-origin:top left;box-shadow:0 4px 18px rgba(0,0,0,.18);font-family:Georgia,"Times New Roman",serif}
/* cadre : double filet vert + or, bandeau tricolore */
.frame{position:absolute;inset:6mm;border:1.6mm solid var(--green);outline:.5mm solid var(--gold);outline-offset:-3.2mm}
.flag{position:absolute;left:6mm;right:6mm;top:6mm;height:3.2mm;background:linear-gradient(90deg,var(--blue) 0 60%,var(--yellow) 60% 80%,var(--red) 80%);z-index:2}
.flag.b{top:auto;bottom:6mm}
.corner{position:absolute;width:12mm;height:12mm;border:.6mm solid var(--gold);z-index:2}
.c1{left:10mm;top:13mm;border-right:0;border-bottom:0}.c2{right:10mm;top:13mm;border-left:0;border-bottom:0}
.c3{left:10mm;bottom:13mm;border-right:0;border-top:0}.c4{right:10mm;bottom:13mm;border-left:0;border-top:0}
.inner{position:absolute;inset:13mm 16mm 12mm;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:8mm;text-align:center}
.logo{width:44mm;height:auto;flex:none;mix-blend-mode:multiply}
.head .t{flex:1}
.head .rep{font:600 3.4mm/1.2 system-ui;letter-spacing:.35mm;color:var(--mute);text-transform:uppercase}
.head .ac{font:700 5mm/1.2 system-ui;color:var(--green-d);margin-top:.6mm}
h1{margin:2mm 0 0;font:700 9mm/1.1 Georgia,serif;letter-spacing:.5mm;white-space:nowrap;color:var(--green-d);text-transform:uppercase}
.sub{font:italic 3.7mm/1.3 Georgia,serif;color:var(--mute);margin-top:.8mm}
.num{width:46mm;text-align:right;font:600 3.2mm/1.3 system-ui;color:var(--mute);flex:none}
.num b{display:block;font:700 4.3mm/1.2 ui-monospace,Consolas,monospace;color:var(--ink)}
.body{flex:1;display:flex;gap:10mm;margin-top:9mm;min-height:0}
.photo{width:46mm;flex:none;text-align:center;font:3.4mm/1.3 system-ui;color:var(--mute)}
.photo .ph{width:46mm;height:54mm;border:.5mm solid var(--green);background:#F2F6F3;display:grid;place-items:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .ph span{font-size:3mm;padding:2mm}
.photo .cap{margin-top:1.4mm}
.main{flex:1;min-width:0}
.cert{font:italic 4.6mm/1.45 Georgia,serif;margin:0 0 3mm}
.name{font:700 12mm/1.08 Georgia,serif;color:var(--ink);margin:0 0 2.5mm;overflow-wrap:anywhere}
.cat{display:inline-block;background:var(--green);color:#fff;border-radius:6mm;padding:1.5mm 6mm;font:700 4.4mm/1.2 system-ui;letter-spacing:.3mm;text-transform:uppercase}
.addr{font:4.2mm/1.3 system-ui;color:var(--mute);margin:2.5mm 0 5mm}
dl{display:grid;grid-template-columns:54mm 1fr;gap:2.6mm 4mm;margin:0;font:4.4mm/1.3 system-ui}
dt{color:var(--mute)}dd{margin:0;font-weight:600}
.side{width:60mm;flex:none;display:flex;flex-direction:column;align-items:center;text-align:center}
.qr{width:56mm;height:56mm;padding:2mm;border:.5mm solid var(--green);background:#fff}
.qr svg{width:100%;height:100%;display:block}
.side .qc{font:3.3mm/1.3 system-ui;color:var(--mute);margin-top:1.6mm}
.st{margin-top:3mm;border-radius:2mm;padding:2mm 3mm;font:700 5.2mm/1.15 system-ui;letter-spacing:.4mm;text-transform:uppercase;color:#fff;width:100%}
.st small{display:block;font:500 2.9mm/1.3 system-ui;letter-spacing:0;text-transform:none;margin-top:.6mm}
.st.valide{background:var(--green)}.st.expire{background:var(--red)}.st.suspendu{background:#C46A00}.st.non_agree{background:#6B7A72}
.oblig{font:italic 3.3mm/1.4 Georgia,serif;color:var(--mute);text-align:center;margin:0 100mm 2mm 52mm;border-top:.3mm solid var(--line);padding-top:2.2mm}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8mm;margin-top:2mm;font:3mm/1.35 system-ui;color:var(--mute)}
.sign{width:62mm;text-align:center}.sign .l{border-top:.35mm solid var(--ink);margin-top:11mm;padding-top:1mm;color:var(--ink);font-weight:600}
.ver{flex:1;text-align:center}
.demo{color:#8A6A00}
.err{max-width:640px;margin:40px auto;background:#fff;border-left:6px solid var(--red);padding:18px 20px;border-radius:10px}
.sealslot{position:absolute;left:18mm;bottom:12mm;z-index:2}.sealslot .sec-seal{width:28mm;height:28mm}
.holoslot{position:absolute;right:76mm;bottom:21mm;z-index:2}
.stamp{position:absolute;right:80mm;bottom:40mm;transform:rotate(-12deg);border:.9mm solid;border-radius:3mm;padding:1.5mm 5mm;font:800 8mm/1 system-ui;letter-spacing:1mm;text-transform:uppercase;opacity:.82;z-index:3}
.stamp.expire{color:var(--red)}.stamp.suspendu{color:#C46A00}.stamp.non_agree{color:#6B7A72}
@page{size:A4 landscape;margin:0}
@media print{html,body{background:#fff}.bar{display:none}#stage{padding:0;display:block}#wrap{width:auto!important;height:auto!important}.sheet{transform:none!important;box-shadow:none}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

.cat.titre{background:var(--blue)}.head .t{min-width:0}.num b:first-of-type{font-size:3.5mm;white-space:nowrap}
table.art{width:100%;border-collapse:collapse;font:3.3mm/1.25 system-ui;margin-top:3mm}table.art th,table.art td{border:.25mm solid #BFCBC4;padding:1mm 1.6mm;text-align:left}table.art th{background:#EEF4F0;font-size:3mm}
.kv{display:flex;gap:6mm;margin-top:3mm;font:3.7mm/1.3 system-ui}.kv div{flex:1;border:.3mm solid var(--line);border-radius:2mm;padding:1.6mm 2.6mm}.kv b{display:block;font:700 5mm/1.2 system-ui}
</style>
</head>
<body>
<div class="bar"><b>Autorisation d’importation</b><button id="pr">🖨 Imprimer / PDF</button><a class="alt" href="/verifier-import.html">Vérifier un QR code</a></div>
<div id="stage"><div id="wrap"><div class="sheet" id="sheet"><div class="sub" style="padding:20mm">Chargement de l’autorisation…</div></div></div></div>
<script src="/assets/qrcode.min.js"></script>
<script src="/config.js"></script>
<script src="/secure-doc.js"></script>
<script>
const API=window.API_BASE||'';const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=new URLSearchParams(location.search);
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const dfr=s=>{if(!s)return '—';const d=new Date(String(s).slice(0,10)+'T12:00:00');return d.getDate()+(d.getDate()===1?'er':'')+' '+MOIS[d.getMonth()]+' '+d.getFullYear()};
const usd=n=>new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(+n||0)+' $';
function qr(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch{return ''}}
function fit(){const sh=$('#sheet'),w=$('#wrap');if(!sh||matchMedia('print').matches)return;const mm=96/25.4,W=297*mm,H=210*mm,s=Math.min(document.documentElement.clientWidth-28,W)/W;sh.style.transform='scale('+s+')';w.style.width=(W*s)+'px';w.style.height=(H*s)+'px'}
async function init(){
  const id=P.get('id'),k=P.get('k');if(!id||!k){fail('Lien incomplet : ouvrez l’autorisation depuis E-Pharma.');return}
  let d;try{const r=await fetch(API+'/api/public/import-doc?id='+encodeURIComponent(id)+'&k='+encodeURIComponent(k),{cache:'no-store'});d=await r.json();if(!r.ok)throw new Error(d.error||'Document introuvable')}catch(e){fail(e.message);return}
  const url=location.origin+'/verifier-import.html?t='+d.jwt,ok=['AUTORISE_ACQUITTE','APURE_DOUANE'].includes(d.statut),exp=d.date_expiration&&new Date(d.date_expiration+'T23:59:59Z')<new Date();
  const st=exp?['expire','Expirée']:ok?['valide','Valide']:['non_agree','Non acquittée'];
  document.title='Autorisation d’importation — '+d.numero_autorisation;
  $('#sheet').innerHTML=`<div class="frame"></div><div class="flag"></div><div class="flag b"></div><i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i>
  <div class="inner">
   <div class="head"><img class="logo" src="/assets/acorep-logo.jpg" alt="ACOREP">
    <div class="t"><div class="rep">République démocratique du Congo</div><div class="ac">Autorité Congolaise de Réglementation Pharmaceutique</div><h1 style="font-size:7.4mm;white-space:normal">AUTORISATION D’IMPORTATION</h1><div class="sub">Autorisation préalable au dédouanement des produits réglementés — à présenter avec la déclaration en douane</div></div>
    <div class="num">N° d’autorisation<b>${esc(d.numero_autorisation)}</b><span style="display:block;margin-top:1.4mm">N° LGU (guichet unique)</span><b class="sec-ctl" style="font-size:3.4mm">${esc(d.numero_lgu)}</b></div></div>
   <div class="body" style="margin-top:4mm">
    <div class="main" style="padding-left:2mm">
     <p class="cert" style="margin-bottom:1mm">Délivrée à</p>
     <div class="name" style="font-size:8mm">${esc(d.operateur)}</div><span class="cat titre">${esc(d.categorie_label)}</span>
     <div class="kv"><div>NIF<b>${esc(d.nif||'—')}</b></div><div>Valeur CAF autorisée<b>${usd(d.caf_proforma)}</b></div><div>Quote-part ACOREP acquittée<b>${usd(d.quote_part)}</b></div><div>Valable jusqu’au<b>${dfr(d.date_expiration)}</b></div></div>
     <table class="art"><tr><th>Code SH</th><th>Désignation</th><th>Lot</th><th>Quantité</th><th>CAF ($)</th><th>AMM</th></tr>${d.lignes.slice(0,6).map(l=>'<tr><td>'+esc(l.code_sh)+'</td><td>'+esc(l.designation)+'</td><td>'+esc(l.lot||'')+'</td><td>'+new Intl.NumberFormat('fr-FR').format(l.qte)+'</td><td>'+usd(l.caf)+'</td><td>'+esc(l.amm||'—')+'</td></tr>').join('')}${d.lignes.length>6?'<tr><td colspan="6">… et '+(d.lignes.length-6)+' autre(s) ligne(s) (voir le registre)</td></tr>':''}</table>
    </div>
    <div class="side"><div class="qr">${qr(url)}</div><div class="qc">Scannez : signature ES256 vérifiable hors ligne et état réel de l’autorisation</div>
     <div class="st ${st[0]}">${st[1]}<small>délivrée le ${dfr(d.date_emission)}</small></div></div>
   </div>
   <div class="sealslot" style="bottom:14mm">${EPSec.seal(d.numero_autorisation,'ENREGISTRÉ')}</div>${P.get('holo')==='0'?'':'<div class="holoslot">'+EPSec.holo(d.numero_autorisation)+'</div>'}
   <div class="oblig" style="margin:0 100mm 2mm 52mm">Le titulaire doit présenter cette autorisation à la douane et à l’OCC. Toute modification de quantité, de produit ou de valeur CAF excédant les tolérances entraîne un complément de redevance ou le blocage du dossier.</div>
   <div class="foot"><div class="sign"><div class="l">Le Directeur Général</div></div>
    <div class="ver">Vérifié sur E-Pharma le ${new Date(d.verified_at).toLocaleString('fr-FR')} · Statut lu en temps réel sur le registre national<br><span class="demo">Prototype de démonstration BITEC — données fictives, document non officiel</span></div>
    <div class="sign"><div class="l">Le Pharmacien Inspecteur</div></div></div>
  </div>`;
  EPSec.layers($('#sheet'),297,210);fit();
}
function fail(m){$('#stage').innerHTML='<div class="err"><b>Autorisation non vérifiable</b><br>'+esc(m)+'</div>'}
window.addEventListener('resize',fit);window.addEventListener('beforeprint',()=>{$('#sheet').style.transform='none'});window.addEventListener('afterprint',fit);
$('#pr').onclick=()=>window.print();init();
</script>
</body>
</html>
