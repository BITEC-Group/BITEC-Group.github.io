<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Pharma</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0E6B38">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --rdc-blue:#007FFF;--rdc-yellow:#F7D618;--rdc-red:#CE1021;
  --ac-green:#0E6B38;--ac-green-d:#0A4F29;--ac-teal:#2BB3B1;
  --bg:#F3F6F4;--card:#fff;--ink:#14231B;--mute:#5B6B62;--line:#DCE4DF;
  --ok:#0E8A45;--warn:#C98A00;--bad:#CE1021;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.flag{height:6px;background:linear-gradient(90deg,var(--rdc-blue) 0 60%,var(--rdc-yellow) 60% 80%,var(--rdc-red) 80%)}
header{background:var(--ac-green);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;position:sticky;top:0;z-index:1200}
header .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
header .brand small{display:block;font-weight:400;font-size:11px;opacity:.85}
header .sp{flex:1}
header select{padding:6px 8px;border-radius:6px;border:0;font:inherit}
#menuBtn{display:none;background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.layout{display:flex;min-height:calc(100vh - 58px)}
nav{width:232px;background:#fff;border-right:1px solid var(--line);padding:10px 8px;flex-shrink:0}
nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none;margin-bottom:2px}
nav a:hover{background:#EAF2ED}
nav a.on{background:var(--ac-green);color:#fff}
nav a.on .dot{background:var(--rdc-yellow)}
nav .dot{width:8px;height:8px;border-radius:50%;background:var(--rdc-blue)}
nav h6{margin:14px 10px 4px;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
main{flex:1;padding:18px;min-width:0}
h1{font-size:21px;margin:0 0 4px}
.sub{color:var(--mute);margin-bottom:14px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{margin:0 0 10px;font-size:15px}
.kpi .v{font-size:27px;font-weight:700}
.kpi .l{color:var(--mute);font-size:12px}
.kpi{border-top:4px solid var(--rdc-blue)}
.kpi.y{border-top-color:var(--rdc-yellow)}.kpi.r{border-top-color:var(--rdc-red)}.kpi.g{border-top-color:var(--ac-green)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#F0F5F2;font-size:12px;color:var(--mute);position:sticky;top:0}
.scroll{overflow:auto;max-height:430px;border:1px solid var(--line);border-radius:8px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.t-ok{background:#DDF3E5;color:#0A6B33}.t-warn{background:#FBEFC8;color:#7A5600}.t-bad{background:#FBDADD;color:#9D0B19}.t-info{background:#D9EBFF;color:#004A99}.t-grey{background:#E8ECEA;color:#46534C}
button,.btn{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--ac-green);background:var(--ac-green);color:#fff;cursor:pointer}
button.alt{background:#fff;color:var(--ac-green)}
button.blue{background:var(--rdc-blue);border-color:var(--rdc-blue)}
button.red{background:var(--rdc-red);border-color:var(--rdc-red)}
button.sm{padding:3px 8px;font-size:12px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;padding:7px 8px;border:1px solid #BFCBC4;border-radius:8px;background:#fff;max-width:100%}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>div{flex:1;min-width:140px}.row input,.row select{width:100%}
.note{background:#FFF8DB;border:1px solid #EBD76A;border-radius:8px;padding:8px 10px;font-size:12.5px;margin:8px 0}
.err{background:#FDE6E8;border:1px solid #F0A5AC;color:#7D0913;border-radius:8px;padding:8px 10px;margin:8px 0}
.okmsg{background:#E3F5EA;border:1px solid #9AD7B1;color:#0A5A2B;border-radius:8px;padding:8px 10px;margin:8px 0}
#map{height:560px;border-radius:12px;border:1px solid var(--line)}
.maplay{display:grid;grid-template-columns:260px 1fr;gap:14px}
.bar{height:14px;border-radius:4px;background:var(--rdc-blue)}
.modal{position:fixed;inset:0;background:rgba(10,30,20,.55);display:none;align-items:center;justify-content:center;z-index:3000;padding:14px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:14px;padding:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.idcard{border:2px solid var(--ac-green);border-radius:14px;overflow:hidden;width:100%;max-width:420px;margin:auto;background:#fff}
.idcard .top{background:var(--ac-green);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px;font-weight:700}
.idcard .stripe{height:6px;background:linear-gradient(90deg,var(--rdc-blue) 0 60%,var(--rdc-yellow) 60% 80%,var(--rdc-red) 80%)}
.idcard .bd{padding:12px;display:flex;gap:12px}
.idcard .bd dl{margin:0;font-size:12.5px;flex:1}.idcard dt{color:var(--mute);font-size:11px}.idcard dd{margin:0 0 5px;font-weight:600}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;overflow:auto}
.pipe .col{background:#EEF3F0;border-radius:10px;padding:8px;min-height:120px}
.pipe .col h4{margin:0 0 6px;font-size:12px}
.pipe .it{background:#fff;border:1px solid var(--line);border-left:4px solid var(--rdc-blue);border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@media(max-width:860px){
  nav{position:fixed;left:-250px;top:64px;bottom:0;z-index:1100;transition:left .2s;overflow:auto}
  nav.open{left:0;box-shadow:0 0 30px rgba(0,0,0,.3)}
  #menuBtn{display:block}
  .maplay{grid-template-columns:1fr}
  #map{height:430px}
  main{padding:12px}
}
@media print{
  header,nav,.flag,#crumbs,.noprint,#ep-pill,#ep-panel,#bell,.navb{display:none!important}
  body{background:#fff}
  .layout{display:block}
  main{padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card{box-shadow:none;break-inside:avoid}
  .scroll{max-height:none!important;overflow:visible!important}
  /* fenêtre ouverte (PV, ordonnance, carte) : seule la fenêtre est imprimée */
  body:has(.modal.on) .layout,body:has(.modal.on) .flag{display:none!important}
  body:has(.modal.on) .modal.on{position:static;background:none;display:block;padding:0}
  body:has(.modal.on) .modal .box{box-shadow:none;max-height:none;overflow:visible;max-width:none;width:auto;padding:0}
}
.navb{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:5px 10px;border-radius:8px;cursor:pointer;font:inherit}
.navb:hover{background:rgba(255,255,255,.28)}.navb:disabled{opacity:.4;cursor:default}
#crumbs{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
#crumbs button{padding:4px 10px}
#bell{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:5px 10px;border-radius:8px;cursor:pointer}
#bell b{background:var(--rdc-red);border-radius:99px;padding:0 6px;margin-left:3px}
#scopePill{background:var(--rdc-yellow);color:#4a3b00;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.tiles{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
a.tile{text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px;border-top:4px solid var(--rdc-blue);transition:transform .1s,box-shadow .1s}
a.tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.12)}
a.tile .ico{font-size:30px}a.tile small{color:var(--mute)}
.maplay2{display:grid;grid-template-columns:230px 1fr 340px;gap:14px}
@media(max-width:1180px){.maplay2{grid-template-columns:1fr}}
.gp .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.gp .kv div{background:#F3F8F5;border-radius:8px;padding:6px 8px}.gp .kv b{display:block;font-size:19px}.gp .kv small{color:var(--mute)}
.leaflet-tooltip.gtip{font:13px system-ui;line-height:1.35}
</style>
</head>

<div class="flag"></div>
<div style="background:#FFF3C4;color:#5A4500;text-align:center;font-size:12px;padding:3px 8px;border-bottom:1px solid #E6D27A">Prototype de démonstration BITEC — non officiel · données 100 % fictives · <a href="/m/" style="color:inherit">Version mobile</a></div>

<script>
let PROV_GEO=null;
/* ====================== Données de référence ====================== */
const PROVS = [ // [nom FR, nom geojson, ville chef-lieu, lat, lon, poids]
 ['Kinshasa','Kinshasa','Kinshasa',-4.33,15.31,40],['Haut-Katanga','Haut-Katanga','Lubumbashi',-11.66,27.48,14],
 ['Nord-Kivu','North Kivu','Goma',-1.68,29.22,10],['Sud-Kivu','South Kivu','Bukavu',-2.5,28.86,8],
 ['Kongo-Central','Kongo-Central','Matadi',-5.82,13.46,6],['Kasaï-Oriental','Kasai-Oriental','Mbuji-Mayi',-6.15,23.6,6],
 ['Kasaï-Central','Central Kasai','Kananga',-5.9,22.42,4],['Tshopo','Tshopo','Kisangani',0.52,25.2,5],
 ['Ituri','Ituri','Bunia',1.56,30.25,4],['Lualaba','Lualaba','Kolwezi',-10.71,25.47,4],
 ['Équateur','Équateur','Mbandaka',0.05,18.26,2],['Tanganyika','Tanganyika','Kalemie',-5.93,29.19,2],
 ['Maniema','Maniema','Kindu',-2.95,25.92,2],['Kwilu','Kwilu','Kikwit',-5.04,18.82,3],
 ['Haut-Lomami','Haut-Lomami','Kamina',-8.74,25.0,2],['Lomami','Lomami','Kabinda',-6.14,24.48,1],
 ['Kasaï','Kasai','Tshikapa',-6.42,20.8,2],['Sankuru','Sankuru','Lodja',-3.49,23.43,1],
 ['Mai-Ndombe','Mai-Ndombe','Inongo',-1.95,18.27,1],['Kwango','Kwango','Kenge',-4.84,16.94,1],
 ['Sud-Ubangi','Sud-Ubangi','Gemena',3.25,19.77,1],['Nord-Ubangi','Nord-Ubangi','Gbadolite',4.28,21.0,1],
 ['Mongala','Mongala','Lisala',2.15,21.51,1],['Bas-Uele','Lower Uele','Buta',2.8,24.73,1],
 ['Haut-Uele','Upper Uele','Isiro',2.77,27.62,1],['Tshuapa','Tshuapa','Boende',-0.28,20.88,1]];
const GEO2FR = Object.fromEntries(PROVS.map(p=>[p[1],p[0]]));
const KIN_COMMUNES=['Gombe','Limete','Ngaliema','Kalamu','Lingwala','Kasa-Vubu','Bandalungwa','Masina','Ndjili','Lemba','Matete','Kintambo','Barumbu','Kinshasa','Bumbu','Makala'];
const IMPORTERS=[];
let PRODUCTS=[ // id, dci, forme, classe, autorisé, contrôlé
 ['P01','Paracétamol 500 mg','Comprimé','Antalgique',1,0],['P02','Amoxicilline 500 mg','Gélule','Antibiotique',1,0],
 ['P03','Artéméther-luméfantrine 20/120 mg','Comprimé','Antipaludique',1,0],['P04','Sels de réhydratation orale','Sachet','Gastro',1,0],
 ['P05','Zinc 20 mg','Comprimé dispersible','Gastro',1,0],['P06','Métronidazole 250 mg','Comprimé','Anti-infectieux',1,0],
 ['P07','Cotrimoxazole 480 mg','Comprimé','Antibiotique',1,0],['P08','Ibuprofène 200 mg','Comprimé','Anti-inflammatoire',1,0],
 ['P09','Albendazole 400 mg','Comprimé','Antiparasitaire',1,0],['P10','Ciprofloxacine 500 mg','Comprimé','Antibiotique',1,0],
 ['P11','Metformine 500 mg','Comprimé','Antidiabétique',1,0],['P12','Amlodipine 5 mg','Comprimé','Cardiovasculaire',1,0],
 ['P13','Salbutamol 100 µg','Inhalateur','Respiratoire',1,0],['P14','Oxytocine 10 UI','Injectable','Santé maternelle',1,1],
 ['P15','Diazépam 5 mg','Comprimé','Psychotrope',1,1],['P16','Tramadol 50 mg','Gélule','Antalgique opioïde',1,1],
 ['P17','Ceftriaxone 1 g','Injectable','Antibiotique',1,0],['P18','Fer + acide folique','Comprimé','Nutrition',1,0],
 ['P19','Insuline humaine 100 UI/ml','Injectable','Antidiabétique',1,1],['P20','Vitamine A 200 000 UI','Capsule','Nutrition',1,0],
 ['X01','Tramadol 225 mg (non enregistré)','Comprimé','Opioïde',0,1],['X02','Sirop « Toux-Max » (lot suspect)','Sirop','Antitussif',0,0],
 ['X03','Artésunate monothérapie orale','Comprimé','Antipaludique',0,0]];
let PROD=new Proxy(Object.fromEntries(PRODUCTS.map(p=>[p[0],p])),{get:(t,k)=>t[k]||[k,String(k),'','',0,0]});
let DOCTORS=[['MD01','Dr Mukendi Kabasele','Kinshasa','CNOM 11204'],['MD02','Dr Ilunga Mwamba','Haut-Katanga','CNOM 20877'],['MD03','Dr Bahati Safari','Nord-Kivu','CNOM 31550'],['MD04','Dr Lukusa Tshimanga','Kasaï-Oriental','CNOM 09922'],['MD05','Dr Mavungu Nsimba','Kongo-Central','CNOM 17766']];
const FINES=[['Absence de pharmacien responsable',500],['Produits périmés détenus',300],['Produits non enregistrés / non autorisés',800],['Titre ou carte annuelle expirée',400],['Officine non identifiée (sans carte)',250],['Défaut de déclaration d’approvisionnement',350],['Cumul de rôles non autorisé',900],['Conditions de stockage non conformes',300]];
const SETTINGS={minDist:500,cardFee:50,fineRate:1};
const PLANS=[['Officine',15],['Dépôt / grossiste',60],['Importateur',250],['Prescripteur (médecin)',5],['Établissement de santé (multi-prescripteurs)',40]];
const ROLES={
  admin:{n:'Administrateur système',m:['home','messages','dash','map','reg','products','supply','rx','insp','signalements','titles','reports','tarifs','roles','sources','licences']},
  dg:{n:'Directeur Général',m:['home','messages','dash','map','reg','products','supply','rx','insp','signalements','titles','reports','tarifs','roles','sources']},
  dga:{n:'Directeur Général Adjoint',m:['home','messages','dash','map','reg','products','supply','rx','insp','signalements','titles','reports','tarifs','roles','sources']},
  dp:{n:'Directeur provincial',m:['home','messages','dash','map','reg','products','supply','insp','signalements','titles','reports','sources']},
  manager:{n:'Manager',m:['home','messages','dash','map','reg','products','supply','rx','insp','signalements','titles','reports','tarifs','sources','licences']},
  insp:{n:'Inspecteur',m:['home','messages','dash','map','reg','products','insp','signalements','supply','titles']},
  pharma:{n:'Gestionnaire d’officine',m:['home','pharma','products','supply','rx']},
  med:{n:'Médecin',m:['home','rx','products']},
  verif:{n:'Agent de vérification',m:['home','messages','signalements','map','products']}};
const MODS={home:['Accueil'],messages:['Messagerie'],signalements:['Signalements'],tarifs:['Barèmes & simulateur'],dash:['Tableau de bord'],map:['Cartographie SIG'],reg:['Identification des officines'],supply:['Circuit d’approvisionnement'],rx:['Prescription électronique'],pharma:['Officine : stock & délivrance'],insp:['Inspection, PV & POS'],titles:['Titres, alertes & AMM'],reports:['Rapports'],sources:['Sources de données'],licences:['Licences mensuelles'],products:['Médicaments autorisés'],roles:['Rôles & droits']};

/* ====================== Utilitaires ====================== */
let _s=20260;const rnd=()=>{_s=(_s*1664525+1013904223)%4294967296;return _s/4294967296};
const pick=a=>a[Math.floor(rnd()*a.length)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
let TODAY=new Date();
const addDays=(d,n)=>new Date(new Date(d).getTime()+n*864e5);
const fd=d=>new Date(d).toISOString().slice(0,10);
const fmt=n=>new Intl.NumberFormat('fr-FR').format(Math.round(n));
const usd=n=>fmt(n)+' $';
const hav=(a,b,c,d)=>{const R=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dg=t(d-b);const q=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(q))};
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(16).toUpperCase().padStart(8,'0')};
const tag=(t,c)=>`<span class="tag t-${c}">${esc(t)}</span>`;
function qrSvg(text,size=110){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:3,margin:0,scalable:true}).replace('<svg','<svg style="width:'+size+'px;height:'+size+'px"')}catch(e){return '<div class="note">QR indisponible hors ligne</div>'}}

const docLink=(t,id)=>`/print.html?t=${t}&id=${encodeURIComponent(id)}&r=${ROLE}&u=${encodeURIComponent(USERID())}`;

/* ====================== Couche données (API REST → base SQL) ====================== */
const DB={officines:[],entities:[],decl:[],rx:[],pv:[],stocks:{},amm:[],audit:[],ammSteps:['Dépôt dossier','Évaluation documentaire','Contrôle qualité / labo','Décision','Délivrée']};
let PERSONAS=[],PID='U01',DOCID='MD01',PERMS={},RBAC={},RES_LABELS={};
let ROLE_LABELS={admin:'Administrateur',manager:'Manager',insp:'Inspecteur',verif:'Agent de vérification',dg:'Directeur Général',dga:'Directeur Général Adjoint',dp:'Directeur provincial',pharma:'Gestionnaire d’officine',med:'Médecin',consumer:'Consommateur'};

const USERID=()=>ROLE==='med'?DOCID:ROLE==='pharma'?(DB.pharmaOff||''):(['insp','manager','verif','dg','dga','dp'].includes(ROLE))?PID:'';
let SCOPE=null;
const apiLabel=(m,u)=>({'POST /api/pv':'Nouveau procès-verbal','POST /api/rx':'Nouvelle prescription','POST /api/decl':'Déclaration d’approvisionnement','POST /api/officines':'Nouvelle officine','POST /api/officines/bulk':'Import d’officines','POST /api/stock':'Ajout de lot en stock'}[m+' '+u]||(m+' '+u.replace('/api/','')));
async function api(m,u,b){

function roleCheck(d){
  const ent=DB.entities.find(e=>e.id===d.fromId);const issues=[];
  if(d.type.startsWith('Importation')&&ent&&!ent.autorises.includes('importateur'))issues.push('Émetteur non autorisé à importer');
  if(d.type.startsWith('Importation → Officine')&&ent&&ent.reels.includes('officine'))issues.push('Importateur exploitant aussi une officine');
  if(d.type==='Importation → Officine')issues.push('Livraison directe importateur → officine (à contrôler)');
  if(d.type.startsWith('Grossiste')&&ent&&ent.reels.includes('importateur'))issues.push('Grossiste cumulant importation');
  if(PROD[d.prod]&&!PROD[d.prod][4])issues.push('Produit non autorisé');
  return issues}

/* ====================== Géolocalisation et cascade province → entité → avenue ====================== */
const loadEntites=async prov=>{try{return await api('GET','/api/public/entites?prov='+encodeURIComponent(prov))}catch{return [...new Set(DB.officines.filter(o=>o.prov===prov).map(o=>o.entite))]}};
const loadAvenues=async(prov,ent)=>{try{return await api('GET','/api/public/avenues?prov='+encodeURIComponent(prov)+'&entite='+encodeURIComponent(ent))}catch{return []}};
function ptInRing(x,y,ring){let c=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
function geoDetect(lat,lon){let prov=null;
  if(PROV_GEO)for(const f of PROV_GEO.features){for(const poly of f.geometry.coordinates){if(ptInRing(lon,lat,poly[0])&&!poly.slice(1).some(h=>ptInRing(lon,lat,h))){prov=GEO2FR[f.properties.name]||f.properties.name;break}}if(prov)break}
  let ent='',bd=1e12;DB.officines.filter(o=>!prov||o.prov===prov).forEach(o=>{const d=hav(lat,lon,o.lat,o.lon);if(d<bd){bd=d;ent=o.entite}});
  return{prov,entite:bd<15000?ent:'',dist:bd}}
function geoBlock(p){const pv=(SCOPE&&ROLE!=='verif')?[SCOPE]:PROVS.map(x=>x[0]);
  return '<label>Province</label><select id="'+p+'_pv">'+pv.map(x=>'<option>'+x+'</option>').join('')+'</select><label>Entité administrative (commune, territoire)</label><input id="'+p+'_en" list="'+p+'_enl" autocomplete="off" placeholder="Choisir dans la liste"><datalist id="'+p+'_enl"></datalist><label>Avenue / rue (liste de la commune)</label><input id="'+p+'_av" list="'+p+'_avl" autocomplete="off" placeholder="Choisir dans la liste ou saisir"><datalist id="'+p+'_avl"></datalist>'+
  '<div class="row" style="margin-top:6px"><div><label>Latitude</label><input id="'+p+'_la" type="number" step="any"></div><div><label>Longitude</label><input id="'+p+'_lo" type="number" step="any"></div><div style="flex:0;align-self:end"><button type="button" class="alt" id="'+p+'_gps">📍 Ma position</button></div></div><div class="note" id="'+p+'_gs">La position remplit automatiquement la province et l’entité (à corriger si besoin).</div>'}
async function bindGeo(p){
  const pv=$('#'+p+'_pv'),en=$('#'+p+'_en'),av=$('#'+p+'_av');
  const fillA=async()=>{const e=en.value.trim();$('#'+p+'_avl').innerHTML=e?(await loadAvenues(pv.value,e)).map(x=>'<option value="'+esc(x)+'">').join(''):''};
  const fillE=async()=>{$('#'+p+'_enl').innerHTML=(await loadEntites(pv.value)).map(x=>'<option value="'+esc(x)+'">').join('');await fillA()};
  pv.onchange=()=>{en.value='';av.value='';fillE()};en.oninput=()=>{av.value='';fillA()};

      const d=geoDetect(la,lo);if(d.prov&&[...pv.options].some(o=>o.value===d.prov))pv.value=d.prov;await fillE();if(d.entite){en.value=d.entite;await fillA()}

  res.map(k=>'<tr><td><b>'+esc(RES_LABELS[k])+'</b></td>'+roles.map(r=>'<td'+(r===ROLE?' style="background:#F2FAF5"':'')+'>'+cell(RBAC[r][k])+'</td>').join('')+'</tr>').join('')+'</table></div>'+

  '<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Règles complémentaires (serveur)</h3><ul style="margin:0;padding-left:18px"><li>Un médecin ne lit, modifie, annule et envoie que <b>ses propres</b> ordonnances.</li><li>Un gestionnaire d’officine ne gère que le stock et les délivrances de <b>son officine</b>.</li><li>Une ordonnance déjà délivrée (même partiellement) ne peut plus être modifiée ni annulée.</li><li>Un PV encaissé ne peut plus être modifié ni supprimé.</li><li>Un médicament utilisé (stock, ordonnances, déclarations) ne peut pas être supprimé : on le marque « non autorisé ».</li><li>Une officine avec historique (délivrances, PV) ne peut pas être supprimée.</li><li>Chaque écriture est tracée dans le journal d’audit avec le profil.</li></ul></div>'+

/* ====================== Démarrage ====================== */
/* Connexion : sur un serveur verrouillé (ALLOW_DEMO_HEADERS=0), le profil vient d'un jeton (POST /api/auth/login) et non du sélecteur de démonstration */
const SES={get tok(){try{return localStorage.getItem('ep_token')}catch{return null}},get user(){try{return JSON.parse(localStorage.getItem('ep_user')||'null')}catch{return null}},
  set(t,u){try{localStorage.setItem('ep_token',t);localStorage.setItem('ep_user',JSON.stringify(u))}catch{}},clear(){try{localStorage.removeItem('ep_token');localStorage.removeItem('ep_user')}catch{}}};
function applySession(){const u=SES.tok&&SES.user;if(!u)return;PID=u.id;ROLE=u.role;if(ROLE==='med')DOCID=u.ref;if(ROLE==='pharma')DB.pharmaOff=u.ref}
function showLogin(msg){
  $('#view').innerHTML='<div class="card" style="max-width:380px;margin:40px auto"><h3>Connexion à E-Pharma</h3><div class="sub">Ce serveur exige une authentification.</div>'+(msg?'<div class="err" style="margin:8px 0">'+esc(msg)+'</div>':'')+
   '<label>Identifiant ou e-mail</label><input id="lg_u" autocomplete="username" autofocus><label>Mot de passe</label><input id="lg_p" type="password" autocomplete="current-password"><p><button id="lg_go">Se connecter</button></p></div>';
  const go1=async()=>{const b=$('#lg_go');b.disabled=true;
    try{const r=await EP.api('POST','/api/auth/login',{login:$('#lg_u').value,password:$('#lg_p').value},{online:true});SES.set(r.token,r.user);location.reload()}
    catch(e){showLogin(e.message)}};
  $('#lg_go').onclick=go1;$('#lg_p').onkeydown=e=>{if(e.key==='Enter')go1()}}
function authBtn(){const b=$('#authBtn'),s=$('#role');if(!b)return;const u=SES.tok&&SES.user;
  if(u){b.textContent='⎋ Déconnexion';b.title='Connecté : '+u.nom+' ('+(u.roleLabel||u.role)+')';b.onclick=()=>{SES.clear();location.reload()};if(s)s.style.display='none'}   // le jeton fixe le profil : le sélecteur de démonstration est masqué
  else{b.textContent='🔑 Connexion';b.title='Se connecter avec un compte';b.onclick=()=>showLogin();if(s)s.style.display=''}}
buildRole();
const h0=location.hash.slice(1);if(MODS[h0])CUR=h0;
(async()=>{
  authBtn();$('#view').innerHTML='<div class="sub">Connexion au serveur…</div>';
  try{PROV_GEO=await (await fetch('/prov.json')).json();try{PERSONAS=await EP.api('GET','/api/users/demo',null,{})}catch{};applySession();buildRole();authBtn();await refresh();NAV.stack=[CUR];NAV.i=0;go()}
  catch(e){if(e.http===401){const had=!!SES.tok;SES.clear();authBtn();return showLogin(had?'Session expirée : reconnectez-vous.':'')}$('#view').innerHTML='<div class="err">Serveur E-Pharma injoignable ('+esc(e.message)+'). Il démarre peut-être : nouvelle tentative automatique dans <b id="rtry">15</b> s. <button class="alt" onclick="location.reload()">Réessayer maintenant</button><br><small>Hébergement local : <code>node server.js</code> (ou la tâche « E-Pharma - en ligne en permanence »).</small></div>';
    let n=15;const iv=setInterval(()=>{n--;const b=document.getElementById('rtry');if(b)b.textContent=n;if(n<=0){clearInterval(iv);location.reload()}},1000)}
})();
var _u=document.createElement('script');_u.src='/update.js';document.head.appendChild(_u);
window.addEventListener('ep-synced',()=>refresh().then(()=>go()).catch(()=>{}));
setInterval(()=>{if(EP.isOnline())loadBell()},60000);
</script>
